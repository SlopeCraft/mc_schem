name: Linux build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        build_type: [ Release, Debug ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt update
          sudo apt install clang-22 gcc-16 g++-16

      - name: Rust build and test
        run: |
          if [ '${{ matrix.built_type }}' = 'Release' ]; then build_flag='--release'; else build_flag=''; fi
          cargo build --all $build_flag
          cargo test -j=default $build_flag

      - name: Large rust test
        if: matrix.built_type == 'Release'
        run: |
          cd ~/Downloads
          wget https://github.com/SlopeCraft/mc_schem/releases/download/v1.3.0/01_large-world-1.20.2.7z 
          echo "078ee2a2b58ae42dbed7b97ad1db9a9601ae65458e9aee2e527e0a23d327cbad 01_large-world-1.20.2.7z" > checksums.sha256
          sha256sum -c checksums.sha256
          cd /home/runner/work/mc_schem/mc_schem
          mv ~/Downloads/01_large-world-1.20.2.7z ./test_files/world
          cargo test -- --ignored

      - name: configure
        run: |
          cmake -S . -B build -G Ninja \
          -DCMAKE_CXX_COMPILER=clang++-22 \
          -DCMAKE_C_COMPILER=clang-22 \
          -DCMAKE_BUILD_TYPE=${{ matrix.built_type }} \
          -DCMAKE_INSTALL_PREFIX=install

      - name: Build & install
        run: |
          cmake --build build --parallel
          cmake --install build

      - name: FFI unit test
        run: |
          cd build
          ctest --parallel

      - name: Find package test
        run: |
          cd tests/find_package
          cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH=/home/runner/work/mc_schem/mc_schem/install
